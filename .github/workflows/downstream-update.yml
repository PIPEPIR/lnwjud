name: lnwjud downstream updater

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lnwjud-downstream-updater
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DOWNSTREAM_REPO: PIPEPIR/lnwjud
      UPSTREAM_REPO: engasnm111/lnwjud

    steps:
      - name: Checkout downstream branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve upstream state and rebase locally
        id: sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ((git remote) -notcontains 'upstream') {
            git remote add upstream "https://github.com/$env:UPSTREAM_REPO.git"
          }
          git fetch upstream main --tags --force

          $currentVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $upstreamPackage = git show upstream/main:package.json | ConvertFrom-Json
          $upstreamVersion = $upstreamPackage.version
          "current_version=$currentVersion" >> $env:GITHUB_OUTPUT
          "upstream_version=$upstreamVersion" >> $env:GITHUB_OUTPUT

          $downstreamHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($downstreamHead)) {
            throw "Unable to resolve downstream source commit before ancestry check"
          }
          $upstreamHead = (git rev-parse upstream/main).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($upstreamHead)) {
            throw "Unable to resolve upstream source commit before ancestry check"
          }

          $nativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          git merge-base --is-ancestor $upstreamHead $downstreamHead
          $ancestorExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $nativePreference
          if ($ancestorExit -ne 0 -and $ancestorExit -ne 1) {
            throw "Unable to determine whether downstream already contains upstream HEAD"
          }

          if ($ancestorExit -eq 1) {
            Write-Host "Upstream commit $upstreamHead is not contained in downstream HEAD $downstreamHead; rebasing owner updates."

            $nativePreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            git rebase upstream/main
            $rebaseExit = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $nativePreference
            if ($rebaseExit -ne 0) {
              $PSNativeCommandUseErrorActionPreference = $false
              git rebase --abort
              $PSNativeCommandUseErrorActionPreference = $nativePreference
              "conflict=true" >> $env:GITHUB_OUTPUT
              "needs_build=false" >> $env:GITHUB_OUTPUT
              exit 0
            }

            # The fork owns its automation policy. Upstream application changes may
            # include .github/workflows edits, but GITHUB_TOKEN cannot push those
            # workflow updates. Restore the downstream workflow tree before pushing
            # so the updater syncs product code without requiring a broader PAT.
            git restore --source=$downstreamHead --worktree --staged -- .github/workflows
            $nativePreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            git diff --cached --quiet -- .github/workflows
            $workflowRestoreNeeded = $LASTEXITCODE -ne 0
            $PSNativeCommandUseErrorActionPreference = $nativePreference
            if ($workflowRestoreNeeded) {
              git commit -m "chore(ci): preserve downstream workflows during upstream sync"
            }

            $rebasedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $releaseVersion = $rebasedVersion
            while ($true) {
              $candidateTag = "lnwjud-downstream-v$releaseVersion"
              $nativePreference = $PSNativeCommandUseErrorActionPreference
              $PSNativeCommandUseErrorActionPreference = $false
              gh release view $candidateTag --repo $env:DOWNSTREAM_REPO *> $null
              $candidateExists = $LASTEXITCODE -eq 0
              $PSNativeCommandUseErrorActionPreference = $nativePreference
              if (-not $candidateExists) {
                break
              }
              if ($releaseVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
                throw "Cannot allocate a downstream patch version from non-standard version $releaseVersion"
              }
              $releaseVersion = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
            }

            if ($releaseVersion -ne $rebasedVersion) {
              Write-Host "Downstream release v$rebasedVersion already exists; allocating v$releaseVersion for the owner-synced build."
              node scripts/set-version.mjs $releaseVersion
              git add -A
              git commit -m "chore(release): prepare downstream $releaseVersion"
            }

            $sourceSha = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceSha)) {
              throw "Unable to resolve post-rebase source commit"
            }
            Write-Host "Validated build source: $sourceSha (workflow trigger: $env:GITHUB_SHA)"
            "version=$releaseVersion" >> $env:GITHUB_OUTPUT
            "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
            "rebased=true" >> $env:GITHUB_OUTPUT
            "needs_build=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceSha)) {
            throw "Unable to resolve source commit"
          }
          Write-Host "Validated build source: $sourceSha (workflow trigger: $env:GITHUB_SHA)"
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

          $tag = "lnwjud-downstream-v$currentVersion"
          $nativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:DOWNSTREAM_REPO *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativePreference
          if ($releaseExists) {
            Write-Host "Downstream release $tag already exists; nothing to do."
            "version=$currentVersion" >> $env:GITHUB_OUTPUT
            "rebased=false" >> $env:GITHUB_OUTPUT
            "conflict=false" >> $env:GITHUB_OUTPUT
            "needs_build=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Current downstream version has no release yet: $tag"
            "version=$currentVersion" >> $env:GITHUB_OUTPUT
            "rebased=false" >> $env:GITHUB_OUTPUT
            "conflict=false" >> $env:GITHUB_OUTPUT
            "needs_build=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Open rebase-conflict issue
        if: steps.sync.outputs.conflict == 'true'
        shell: pwsh
        run: |
          $title = "lnwjud downstream rebase conflict for upstream v${{ steps.sync.outputs.upstream_version }}"
          $existing = gh issue list --repo $env:DOWNSTREAM_REPO --state open --json title --jq ".[] | select(.title == \"$title\") | .title"
          if (-not $existing) {
            gh issue create --repo $env:DOWNSTREAM_REPO --title $title --body @"
          The scheduled downstream updater could not rebase the downstream lnwjud changes onto upstream v${{ steps.sync.outputs.upstream_version }}.

          No branch was pushed and no release was published.

          Resolve the rebase locally, rerun the downstream Codex/desktop/CLI validation, then dispatch this workflow again.
          "@
          }

      - name: Setup Node.js 24
        if: steps.sync.outputs.needs_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup .NET 8 SDK
        if: steps.sync.outputs.needs_build == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install cosign
        if: steps.sync.outputs.needs_build == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.1.3'

      - name: Enable Corepack and install dependencies
        if: steps.sync.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          corepack pnpm@10.15.0 install --frozen-lockfile

      - name: Validate downstream Codex integration
        if: steps.sync.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          node --test apps/desktop/scripts/release-source-commit.test.mjs
          corepack pnpm@10.15.0 --filter @lnwjud/codex test
          corepack pnpm@10.15.0 --filter @lnwjud/codex... build
          corepack pnpm@10.15.0 --filter @lnwjud/codex typecheck
          corepack pnpm@10.15.0 --filter @lnwjud/desktop typecheck
          corepack pnpm@10.15.0 --filter @lnwjud/cli typecheck

      - name: Package Windows downstream build
        if: steps.sync.outputs.needs_build == 'true'
        shell: pwsh
        env:
          LNWJUD_COSIGN_PATH: cosign
          LNWJUD_EXPECTED_COMMIT_SHA: ${{ steps.sync.outputs.source_sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LNWJUD_EXPECTED_COMMIT_SHA)) {
            throw "sync step did not provide the validated source SHA"
          }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/package-windows.ps1

      - name: Packaged MCP and security smoke
        if: steps.sync.outputs.needs_build == 'true'
        shell: pwsh
        timeout-minutes: 10
        env:
          LNWJUD_PACKAGED_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/installers/win-unpacked/lnwjud.exe
          PLAYWRIGHT_HTML_OPEN: never
        run: corepack pnpm@10.15.0 --filter @lnwjud/desktop exec playwright test --config playwright.config.ts desktop-dashboard.e2e.ts desktop-mcp-client.e2e.ts tools-doctor.e2e.ts electron-security.e2e.ts --trace=retain-on-failure --reporter=list

      - name: Push validated rebased downstream branch
        if: steps.sync.outputs.needs_build == 'true' && steps.sync.outputs.rebased == 'true'
        shell: pwsh
        run: git push --force-with-lease origin HEAD:${{ github.ref_name }}

      - name: Publish downstream release
        if: steps.sync.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.sync.outputs.version }}"
          $tag = "lnwjud-downstream-v$version"
          $dir = "apps/desktop/dist/installers"

          $nativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:DOWNSTREAM_REPO *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativePreference
          if ($releaseExists) {
            Write-Host "Release $tag already exists; keeping the existing validated release."
            exit 0
          }

          $assets = @(
            "$dir/lnwjud-Setup-$version.exe",
            "$dir/lnwjud-Setup-$version.exe.blockmap",
            "$dir/lnwjud-Portable-$version.exe",
            "$dir/latest.yml",
            "$dir/portable.yml",
            "$dir/SHA256SUMS.txt",
            "$dir/PROVENANCE.json"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Required release asset missing: $asset"
            }
          }

          $notes = @"
          Downstream lnwjud build based on upstream lnwjud v$version.

          Downstream contract:
          - preserve local lnwjud optimizations on top of the owner/upstream repository;
          - Codex uses its normal native configuration with no external decision router;
          - validate Codex, desktop, CLI, packaging, MCP, and security before publishing.
          "@

          gh release create $tag @assets --repo $env:DOWNSTREAM_REPO --target ${{ github.ref_name }} --title "lnwjud v$version downstream" --notes $notes

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lnwjud-downstream-failure-${{ github.run_id }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
            apps/desktop/dist/installers/PROVENANCE.json
          if-no-files-found: ignore
          retention-days: 7
